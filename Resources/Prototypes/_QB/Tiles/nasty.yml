- type: entity
  id: FloorWaterNastyEntity
  name: nasty water
  description: You don't need me to tell you not to drink from this.
  placement:
    mode: SnapgridCenter
    snap:
    - Wall
  components:
  - type: FloorOccluder
  - type: Transform
    anchored: true
  - type: SyncSprite
  - type: Clickable
  - type: Sprite
    sprite: _QB/Tiles/Planet/nasty.rsi # QB
    drawdepth: BelowFloor
    layers:
      - state: nasty_water
  - type: SolutionContainerManager
    solutions:
      pool:
        maxVol: 9999999 #.inf seems to break the whole yaml file, but would definitely be preferable.
        reagents:
        - ReagentId: Mopwata
          Quantity: 100000
        - ReagentId: VentCrud
          Quantity: 10000
        - ReagentId: Mold
          Quantity: 10000
        - ReagentId: ToxinTrash
          Quantity: 1000
        - ReagentId: Slime
          Quantity: 25000
        - ReagentId: Ammonia
          Quantity: 1000
  - type: DrainableSolution
    solution: pool
  - type: SpeedModifierContacts
    walkSpeedModifier: 0.5
    sprintSpeedModifier: 0.5
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,0.5"
        layer:
          - SlipLayer
        mask:
          - ItemMask
        density: 1000
        hard: false
  - type: FootstepModifier
    footstepSoundCollection:
      collection: FootstepWater
      params:
        volume: 8
  - type: StepTrigger
    requiredTriggeredSpeed: 0
    intersectRatio: 0.1
    blacklist:
      tags:
        - Catwalk
  - type: TileEntityEffect
    effects:
    - !type:Extinguish
