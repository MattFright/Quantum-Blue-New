- type: entity
  parent: WeaponPistolViper
  id: WeaponPistolViperAppraisal
  name: appraisal tool
  suffix: Gun
  description: A beancounter's best friend, with a quantum connection to the galactic market and the ability to appraise even the toughest items. It will also tell you if a crate contains a completed bounty.
  components:
  - type: Item
    size: Small
    shape: null
  - type: Sprite
    sprite: _Impstation/Objects/Weapons/Guns/Pistols/appraisal-viper.rsi # imp - appraisal tool resprite
  - type: Gun
    fireRate: 4.5
    showExamineText: false
    soundGunshot:
      path: /Audio/Items/appraiser.ogg
  - type: PriceGun
  - type: UseDelay
    delay: 1 # To allow use of the price gun while not hindering the gun portion of it.
  - type: Tag
    tags:
    - AppraisalTool
    - Sidearm
    # - ConcealCarry # imp not a tag we have
  - type: GuideHelp
    guides:
    - Cargo

- type: entity
  name: psi-breaker
  parent: BaseWeaponPistol
  id: WeaponPistolPsiBreaker
  description: A small, flashy pistol with a marble style grip. Provides no tactical advantage. Uses .38 special ammo.
  components:
  - type: Sprite
    sprite: _DV/Objects/Weapons/Guns/Pistols/psibreaker.rsi
  - type: Gun
    fireRate: 3.5
    availableModes:
    - SemiAuto
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/pistol.ogg
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: MagazinePistolSpecialMindbreaker
        insertSound: /Audio/Weapons/Guns/MagIn/pistol_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/pistol_magout.ogg
        priority: 2
        whitelist:
          tags:
            - MagazinePistolSpecial
      gun_chamber:
        name: Chamber
        startingItem: CartridgeSpecialMindbreaker
        priority: 1
        whitelist:
          tags:
            - CartridgeSpecial
  - type: ContainerContainer
    containers:
      gun_magazine: !type:ContainerSlot
      gun_chamber: !type:ContainerSlot
  # qb changes begin
  - type: GunDamage
    damage:
      types:
        Piercing: 0 # The ammo does all damage.
    damageSpecific:
      DamageVariable:
        types:
          Piercing: 0
  # qb changes end
