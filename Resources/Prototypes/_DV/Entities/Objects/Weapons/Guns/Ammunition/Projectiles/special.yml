- type: entity
  id: BulletSpecialMindbreaker
  name: bullet (.38 special mindbreaker)
  parent: BaseBulletPractice
  noSpawn: true
  components:
  - type: Projectile
    damage:
      types:
        Blunt: 1
  - type: SolutionContainerManager
    solutions:
      ammo:
        maxVol: 10 # qb - fix from 9 to 10
  - type: RefillableSolution
    solution: ammo
  - type: DrainableSolution
    solution: ammo
  - type: SolutionInjectOnProjectileHit
    transferAmount: 10 # qb - fix from 9 to 10
    blockSlots: NONE #shouldn't be blocked by a mask
    solution: ammo # qb - doesn't work without this being added
  - type: InjectableSolution
    solution: ammo
